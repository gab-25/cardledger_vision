[project]
name = "cardledger-vision"
version = "0.1.0"
description = "Recognizes trading cards in photos by perceptual hash"
requires-python = ">=3.14"
license = { text = "GPL-3.0-only" }
dependencies = ["numpy", "opencv-python-headless", "httpx"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardledger_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
